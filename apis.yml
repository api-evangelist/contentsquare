apis:
- aid: contentsquare:data-export-api
  name: Contentsquare Data Export API
  description: >-
    REST API for exporting Contentsquare metrics and raw analytics data. Authentication uses OAuth 2.0
    client_credentials flow against https://api.contentsquare.com/v1/oauth/token, which returns a JWT
    access token valid for one hour plus a dynamic regional base URL (for example https://api.eu-west-1.production.contentsquare.com).
  humanURL: https://docs.contentsquare.com/en/api/export/
  baseURL: https://api.eu-west-1.production.contentsquare.com
  tags:
  - Digital Experience Analytics
  - Data Export
  - Metrics
  - OAuth
  properties:
  - type: Documentation
    url: https://docs.contentsquare.com/en/api/export/
  - type: Authentication
    url: https://docs.contentsquare.com/en/api/export/authentication/
  - url: graphql/contentsquare-graphql.md
    type: GraphQL
- aid: contentsquare:enrichment-api
  name: Contentsquare Enrichment API
  description: >-
    REST API for sending enrichment data batches into Contentsquare, enabling teams to merge first-party
    data with captured session data. Uses the same OAuth 2.0 client credentials authentication and dynamic
    regional base URLs as the Data Export API.
  humanURL: https://docs.contentsquare.com/en/api/enrichment/
  baseURL: https://enrichment-api.eu-west-1.production.contentsquare.com
