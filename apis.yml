aid: contentsquare
name: Contentsquare
description: Contentsquare is a digital experience analytics platform that captures
  every user interaction on web and mobile properties to surface friction points,
  conversion blockers, and behavioral insights via session replay, heatmaps, journey
  analysis, and zone-based analytics. The platform helps product, marketing, and UX
  teams optimize digital experiences with AI-driven recommendations. Contentsquare
  offers Data Export and Enrichment REST APIs authenticated via OAuth 2.0 client credentials
  with dynamic regional base URLs returned at authentication time.
